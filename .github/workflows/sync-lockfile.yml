name: Sync workspace lockfile

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already synchronized."
            git rm .github/workflows/sync-lockfile.yml
            git commit -m "chore: remove temporary lockfile sync workflow"
          else
            git add pnpm-lock.yaml
            git rm .github/workflows/sync-lockfile.yml
            git commit -m "fix: synchronize workspace lockfile"
          fi
          git push
